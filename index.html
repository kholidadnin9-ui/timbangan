<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timbangan Pintar - Media Pembelajaran</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
        }

        @keyframes drop {
          0% { transform: translateY(-50px) scale(0); opacity: 0; }
          60% { transform: translateY(5px) scale(1.2); opacity: 1; }
          100% { transform: translateY(0) scale(1); }
        }
        .animate-drop {
          animation: drop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-bounce-slow {
          animation: bounce 3s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-5%); }
            50% { transform: translateY(5%); }
        }
        .animate-fade-in {
          animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Ikon Komponen (Inline SVG pengganti Lucide-React untuk HTML Standalone) ---
        const IconScale = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
        );
        const IconRefreshCcw = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        );
        const IconPlus = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const IconMinus = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>
        );
        const IconCheckCircle = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
        );

        // --- Aplikasi Utama ---
        const TimbanganApp = () => {
            const objects = [
                { id: 1, name: 'Boneka', weight: 6, icon: '🧸', color: 'bg-pink-100 border-pink-300', textColor: 'text-pink-700' },
                { id: 2, name: 'Buku', weight: 10, icon: '📕', color: 'bg-blue-100 border-blue-300', textColor: 'text-blue-700' },
                { id: 3, name: 'Bola', weight: 4, icon: '⚽', color: 'bg-orange-100 border-orange-300', textColor: 'text-orange-700' },
                { id: 4, name: 'Tempat Pensil', weight: 4, icon: '✏️', color: 'bg-purple-100 border-purple-300', textColor: 'text-purple-700' }
            ];

            const [selectedObject, setSelectedObject] = useState(null);
            const [objectCount, setObjectCount] = useState(1);
            const [marbleCount, setMarbleCount] = useState(0);
            const [rotation, setRotation] = useState(0);
            const [feedback, setFeedback] = useState("Pilih benda untuk ditimbang!");
            const [isBalanced, setIsBalanced] = useState(false);
            const [showConfetti, setShowConfetti] = useState(false);

            const handleSelectObject = (obj) => {
                setSelectedObject(obj);
                setObjectCount(1);
                setMarbleCount(0);
                setIsBalanced(false);
                setShowConfetti(false);
                setRotation(-20); 
                setFeedback(`Ayo cari tahu berat 1 ${obj.name}!`);
            };

            const addObjectCount = () => {
                if (!selectedObject || objectCount >= 5) return;
                setObjectCount(prev => prev + 1);
                setIsBalanced(false);
                setShowConfetti(false);
            };

            const removeObjectCount = () => {
                if (!selectedObject || objectCount <= 1) return;
                setObjectCount(prev => prev - 1);
                setIsBalanced(false);
                setShowConfetti(false);
            };

            const addMarble = () => {
                if (!selectedObject) return;
                setMarbleCount(prev => prev + 1);
            };

            const removeMarble = () => {
                if (!selectedObject || marbleCount <= 0) return;
                setMarbleCount(prev => prev - 1);
            };

            useEffect(() => {
                if (!selectedObject) {
                    setRotation(0);
                    return;
                }

                const target = selectedObject.weight * objectCount;
                const current = marbleCount;

                if (current === target) {
                    setRotation(0);
                    setFeedback(`🎉 BENAR! Berat ${objectCount} ${selectedObject.name} sama dengan ${current} Kelereng! 🎉`);
                    setIsBalanced(true);
                    setShowConfetti(true);
                } else if (current < target) {
                    const diff = target - current;
                    let angle = -25 + (current / target) * 20; 
                    setRotation(Math.min(angle, -5)); 
                    setFeedback(`${objectCount} ${selectedObject.name} masih lebih berat. Tambah kelereng!`);
                    setIsBalanced(false);
                    setShowConfetti(false);
                } else {
                    setRotation(20);
                    setFeedback("Waduh! Kelerengnya terlalu berat. Kurangi kelerengnya.");
                    setIsBalanced(false);
                    setShowConfetti(false);
                }
            }, [marbleCount, selectedObject, objectCount]);

            const handleReset = () => {
                setSelectedObject(null);
                setObjectCount(1);
                setMarbleCount(0);
                setRotation(0);
                setFeedback("Pilih benda untuk ditimbang!");
                setIsBalanced(false);
                setShowConfetti(false);
            };

            return (
                <div className="min-h-screen bg-gradient-to-b from-sky-200 to-green-100 font-sans p-4 flex flex-col items-center">
                
                {/* Header */}
                <header className="w-full max-w-4xl flex justify-between items-center bg-white p-4 rounded-2xl shadow-lg mb-6 border-b-4 border-sky-400">
                    <div className="flex items-center gap-2">
                    <IconScale className="text-sky-600 w-8 h-8" />
                    <h1 className="text-xl md:text-2xl font-bold text-slate-700">Timbangan Pintar</h1>
                    </div>
                    <button 
                    onClick={handleReset}
                    className="flex items-center gap-2 px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white rounded-xl font-bold transition-all shadow-md active:scale-95"
                    >
                    <IconRefreshCcw className="w-4 h-4" /> Ulangi
                    </button>
                </header>

                {/* Main Content Area */}
                <div className="w-full max-w-4xl flex flex-col md:flex-row gap-6">
                    
                    {/* Left Panel: Object Selection */}
                    <div className="w-full md:w-1/3 space-y-4">
                    
                    {/* Section 1: Pilih Tipe Benda */}
                    <div className="bg-white p-5 rounded-3xl shadow-xl border-2 border-white/50">
                        <h2 className="text-lg font-bold text-slate-600 mb-4 text-center">1. Pilih Benda</h2>
                        <div className="grid grid-cols-2 gap-3">
                        {objects.map((obj) => (
                            <button
                            key={obj.id}
                            onClick={() => handleSelectObject(obj)}
                            className={`flex flex-col items-center justify-center p-3 rounded-2xl border-2 transition-all duration-300 transform hover:scale-105 ${
                                selectedObject?.id === obj.id 
                                ? 'bg-yellow-100 border-yellow-400 shadow-inner scale-95 ring-2 ring-yellow-400 ring-offset-2' 
                                : `${obj.color} hover:shadow-md`
                            }`}
                            >
                            <span className="text-4xl mb-2 filter drop-shadow-sm">{obj.icon}</span>
                            <span className="font-bold text-slate-700 text-sm">{obj.name}</span>
                            </button>
                        ))}
                        </div>
                    </div>

                    {/* Section 2: Atur Jumlah Benda */}
                    {selectedObject && (
                        <div className="bg-white p-5 rounded-3xl shadow-xl border-2 border-white/50 animate-fade-in">
                        <h2 className="text-lg font-bold text-slate-600 mb-4 text-center">2. Jumlah Benda</h2>
                        <div className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200">
                            <button 
                            onClick={removeObjectCount}
                            disabled={objectCount <= 1}
                            className="p-2 bg-rose-100 text-rose-600 rounded-lg hover:bg-rose-200 disabled:opacity-30 disabled:cursor-not-allowed transition"
                            >
                            <IconMinus className="w-5 h-5" />
                            </button>
                            
                            <div className="flex flex-col items-center">
                            <span className="text-3xl font-bold text-slate-700">{objectCount}</span>
                            <span className="text-xs text-slate-500">{selectedObject.name}</span>
                            </div>

                            <button 
                            onClick={addObjectCount}
                            disabled={objectCount >= 5}
                            className="p-2 bg-green-100 text-green-600 rounded-lg hover:bg-green-200 disabled:opacity-30 disabled:cursor-not-allowed transition"
                            >
                            <IconPlus className="w-5 h-5" />
                            </button>
                        </div>
                        
                        <div className="mt-4 p-4 bg-indigo-50 rounded-xl border border-indigo-100 text-center">
                            <p className="text-indigo-900 font-medium">
                                Ayo selidiki! Butuh berapa kelereng agar seimbang dengan <strong>{objectCount} {selectedObject.name}</strong>?
                            </p>
                            <p className="text-xs text-indigo-400 mt-2">
                                (Masukkan kelereng satu per satu)
                            </p>
                        </div>
                        </div>
                    )}
                    </div>

                    {/* Right Panel: The Scale & Controls */}
                    <div className="w-full md:w-2/3 flex flex-col items-center">
                    
                    {/* Feedback Banner */}
                    <div className={`w-full text-center p-3 rounded-xl mb-6 font-bold text-lg shadow-sm transition-colors duration-500 border-2 ${
                        isBalanced 
                        ? 'bg-green-100 text-green-700 border-green-400 animate-pulse' 
                        : 'bg-white text-slate-600 border-transparent'
                    }`}>
                        {feedback}
                    </div>

                    {/* Scale Visual Container */}
                    <div className="relative w-full h-80 flex justify-center items-end mb-4 select-none">
                        
                        {/* The Base (Static) */}
                        <div className="absolute bottom-0 w-32 h-24 bg-slate-700 rounded-t-full z-10 mx-auto shadow-2xl"></div>
                        <div className="absolute bottom-0 w-4 h-48 bg-slate-600 z-0 mx-auto rounded-t-lg"></div>

                        {/* The Beam (Rotates) */}
                        <div 
                        className="absolute top-24 w-11/12 md:w-3/4 h-4 bg-slate-500 rounded-full transition-transform duration-700 ease-in-out origin-center z-20 shadow-lg flex justify-between items-center"
                        style={{ transform: `rotate(${rotation}deg)` }}
                        >
                        {/* Left String & Pan (Objects) */}
                        <div className="relative h-40 w-0.5 bg-slate-400 left-4 top-20 flex flex-col items-center">
                            <div className="absolute bottom-0 w-32 h-16 bg-yellow-500 rounded-b-full shadow-md border-b-4 border-yellow-600 flex flex-wrap-reverse content-start justify-center items-end p-2 gap-1 overflow-visible transform translate-y-full">
                                {/* Selected Objects sit here - Stack logic */}
                                {selectedObject && Array.from({ length: objectCount }).map((_, i) => (
                                <div key={i} className="text-5xl filter drop-shadow-lg transform transition-all duration-300 animate-bounce-slow" style={{ animationDelay: `${i * 0.1}s` }}>
                                    {selectedObject.icon}
                                </div>
                                ))}
                            </div>
                        </div>

                        {/* Pivot Point */}
                        <div className="w-8 h-8 bg-slate-300 rounded-full border-4 border-slate-600 shadow-inner z-30"></div>

                        {/* Right String & Pan (Marbles) */}
                        <div className="relative h-40 w-0.5 bg-slate-400 right-4 top-20 flex flex-col items-center">
                            <div className="absolute bottom-0 w-32 h-16 bg-yellow-500 rounded-b-full shadow-md border-b-4 border-yellow-600 flex flex-wrap-reverse content-start justify-center items-end p-1 gap-0.5 overflow-visible transform translate-y-full">
                                {/* Marbles sit here */}
                                {Array.from({ length: marbleCount }).map((_, i) => (
                                <span key={i} className="text-lg leading-none animate-drop filter drop-shadow-sm">🔮</span>
                                ))}
                            </div>
                        </div>
                        </div>
                        
                        {/* Confetti Effect */}
                        {showConfetti && (
                        <div className="absolute inset-0 pointer-events-none flex justify-center items-start overflow-hidden z-50">
                            <div className="text-6xl animate-bounce">✨</div>
                            <div className="text-6xl animate-pulse delay-75">🌟</div>
                            <div className="text-6xl animate-bounce delay-150">✨</div>
                        </div>
                        )}
                    </div>

                    {/* Controls */}
                    <div className={`w-full max-w-md flex flex-col items-center bg-white/80 p-6 rounded-3xl shadow-lg backdrop-blur-sm transition-opacity duration-300 ${!selectedObject ? 'opacity-50 pointer-events-none' : 'opacity-100'}`}>
                        <h3 className="text-slate-600 font-bold mb-4 flex items-center gap-2">
                        Jumlah Kelereng: 
                        <span className="text-3xl text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg border border-indigo-100">
                            {marbleCount}
                        </span>
                        </h3>
                        
                        <div className="flex items-center gap-6">
                        <button 
                            onClick={removeMarble}
                            disabled={marbleCount === 0}
                            className="group relative w-20 h-20 rounded-2xl bg-white border-2 border-rose-200 text-rose-500 flex items-center justify-center hover:bg-rose-50 hover:border-rose-400 hover:scale-105 active:scale-95 disabled:opacity-50 disabled:hover:scale-100 transition-all shadow-sm"
                        >
                            <IconMinus className="w-8 h-8" />
                            <span className="absolute -bottom-6 text-xs font-bold text-rose-400 opacity-0 group-hover:opacity-100 transition-opacity">Kurang</span>
                        </button>

                        <button 
                            onClick={addMarble}
                            disabled={isBalanced}
                            className={`group relative w-24 h-24 rounded-2xl flex items-center justify-center text-white shadow-lg transform transition-all active:scale-95 hover:shadow-xl border-4 ${
                            isBalanced 
                                ? 'bg-green-500 border-green-400 cursor-default scale-105' 
                                : 'bg-indigo-500 border-indigo-400 hover:bg-indigo-600 hover:scale-110'
                            }`}
                        >
                            {isBalanced ? <IconCheckCircle className="w-12 h-12" /> : <IconPlus className="w-12 h-12" />}
                            {!isBalanced && (
                            <span className="absolute -bottom-6 text-xs font-bold text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity">Tambah</span>
                            )}
                        </button>
                        </div>
                        
                        {!isBalanced && (
                        <p className="mt-6 text-sm text-slate-500 bg-white/50 px-4 py-2 rounded-full">
                            Klik tombol <strong className="text-indigo-600">(+)</strong> untuk menambah kelereng
                        </p>
                        )}
                    </div>

                    </div>
                </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TimbanganApp />);
    </script>
</body>
</html>
